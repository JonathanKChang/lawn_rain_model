    day_of_year: 172
    latitude: 39.0

  - name: split_storms_1in_total
    duration_hours: 72
    rain_events:
      - hour: 0
        inches: 0.5
      - hour: 6
        inches: 0.5
    weather:
      temp: 70
      rh: 72
      wind: 4
      clouds: 55
    use_solar_model: true
    start_hour: 6
    day_of_year: 172
    latitude: 39.0

  - name: winter_rain_0.5in
    duration_hours: 96
    rain_events:
      - hour: 0
        inches: 0.5
    weather:
      temp: 45
      rh: 80
      wind: 8
      clouds: 70
    use_solar_model: true
    start_hour: 8
    day_of_year: 355
    latitude: 39.0

  - name: rain_on_wet_ground
    duration_hours: 72
    initial_wetness: 35.0
    rain_events:
      - hour: 12
        inches: 0.5
    weather:
      temp: 70
      rh: 68
      wind: 5
      clouds: 35
    use_solar_model: true
    start_hour: 6
    day_of_year: 172
    latitude: 39.0

  # Cold/warm diurnal swing: 38F overnight -> 50F daytime.
  # Mow gate opens at hour 8 when temp crosses threshold.
  # Use this to visually inspect visc_factor column -- should see it rise
  # as the day warms and capillary rate picks back up.
  - name: diurnal_cold_to_warm
    duration_hours: 48
    rain_events:
      - hour: 0
        inches: 0.75
    weather:
      temp: 44
      rh: 82
      wind: 4
      clouds: 60
      elevation: 0.0
    use_solar_model: true
    start_hour: 22
    day_of_year: 80
    latitude: 39.0
