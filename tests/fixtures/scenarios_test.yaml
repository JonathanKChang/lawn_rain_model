# Minimal test scenarios for unit testing ScenarioLoader and history-backed scenarios.
scenarios:
  - name: history_test_scenario
    history_file: test_history.csv
    mow_threshold: 5.0
    calibration:
      target_hours: 12.0
      weight: 1.0
      note: "test scenario using fixture history"

  - name: simple_warm_sunny
    duration_hours: 48
    rain_events:
      - hour: 0
        inches: 1.0
    weather:
      temp: 80
      rh: 50
      wind: 8
      clouds: 20
    use_solar_model: true
    start_hour: 8
    day_of_year: 172
    latitude: 39.0
    mow_threshold: 5.0
    calibration:
      target_hours_min: 4
      target_hours_max: 10
      weight: 1.0
      note: "simple warm sunny test"
