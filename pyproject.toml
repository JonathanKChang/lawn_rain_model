[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawn_rain_model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
lawn_rain_model = "lawn_rain_model.cli.commands:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lawn_rain_model*"]

[tool.mypy]
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lawn_rain_model --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["lawn_rain_model"]
omit = [
    "*/__pycache__/*",
    "tests/*",
    "frontend/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
